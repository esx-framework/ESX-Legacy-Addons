<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESX Animations - Test</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script defer src="../vendor/lucide.min.js"></script>
    <script defer src="../js/icons.js"></script>
    <script defer src="../js/catalog.js"></script>
    <script defer src="mock.js"></script>
    <script defer src="../js/app.js"></script>
  </head>
  <body>
    <div style="padding: 20px; background: #161616; min-height: 100vh;">
      <h3 style="color: #F2F2F2; margin-bottom: 10px;">esx_animations NUI Test</h3>
      <p style="color: #969696; font-size: 13px; margin-bottom: 15px;">
        The animations panel opens automatically after 300ms.
      </p>
      <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
        <button onclick="AnimationsTest.sendOpen()" style="padding: 8px 16px; background: #FB9B04; color: #161616; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;">Open Menu</button>
        <button onclick="AnimationsTest.sendClose()" style="padding: 8px 16px; background: #383838; color: #F2F2F2; border: 1px solid #F2F2F2; border-radius: 4px; font-weight: 600; cursor: pointer;">Close Menu</button>
        <button onclick="AnimationsTest.sendState(true, null, null)" style="padding: 8px 16px; background: #383838; color: #F2F2F2; border: 1px solid #F2F2F2; border-radius: 4px; font-weight: 600; cursor: pointer;">Set Playing</button>
      </div>
      <p style="color: #969696; font-size: 12px;">
        Press ESC to close, Backspace to stop. Click a category then an animation.
      </p>
    </div>

    <main id="app" class="animations hidden">
      <section class="anim-shell" aria-labelledby="animTitle">
        <header class="brand-header">
          <img class="esx-logo" src="../assets/esx-logo.png" width="48" height="18" alt="ESX" />
          <div class="brand-heading">
            <h1 id="animTitle">Animations</h1>
            <span id="categoryName">Choose an animation</span>
          </div>
          <button id="closeBtn" class="icon-button" type="button" data-icon="X" aria-label="Close" data-tooltip="Close"></button>
        </header>

        <div class="anim-content">
          <nav id="categoryTabs" class="category-rail" aria-label="Animation categories"></nav>

          <div class="anim-main">
            <div class="catalog-toolbar">
              <label class="search-field">
                <span data-icon="Search" aria-hidden="true"></span>
                <input id="searchInput" type="search" placeholder="Search animations" aria-label="Search animations" autocomplete="off" spellcheck="false" />
              </label>
            </div>

            <div id="itemList" class="item-list"></div>
          </div>
        </div>

        <footer class="panel-footer">
          <button id="stopBtn" class="action-button primary" type="button">
            <span data-icon="Square" data-icon-fill="true" aria-hidden="true"></span>
            <span class="btn-label">Stop Animation</span>
          </button>
        </footer>
      </section>

      <div id="categoryTooltip" class="category-tooltip" role="tooltip"></div>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
