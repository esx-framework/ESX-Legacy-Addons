<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESX Job Listing</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="app" class="jobcenter hidden" aria-labelledby="jobTitle">
      <section class="job-shell">
        <header class="brand-header">
          <img class="esx-logo" src="assets/esx-logo.png" width="48" height="18" alt="ESX" />
          <div class="brand-heading">
            <h1 id="jobTitle">Job Centre</h1>
            <span id="jobSubtitle">Choose your career</span>
          </div>
          <button id="closeBtn" class="icon-button" type="button" data-icon="X" aria-label="Close" data-tooltip="Close"></button>
        </header>

        <div class="catalog-toolbar">
          <div class="search-field">
            <span data-icon="Search" aria-hidden="true"></span>
            <input id="searchInput" type="search" placeholder="Search jobs..." aria-label="Search jobs" autocomplete="off" spellcheck="false" />
            <button id="searchClear" class="search-clear hidden" type="button" data-icon="X" aria-label="Clear search"></button>
          </div>
        </div>

        <div id="jobList" class="job-list" role="listbox" aria-label="Available jobs"></div>

        <div id="confirmModal" class="confirm-backdrop hidden">
          <div class="confirm-card">
            <div class="confirm-icon" data-icon="Briefcase" aria-hidden="true"></div>
            <h2 id="confirmTitle">Apply for this job?</h2>
            <p id="confirmText"></p>
            <div class="confirm-actions">
              <button id="confirmNo" class="action-button ghost" type="button">Cancel</button>
              <button id="confirmYes" class="action-button primary" type="button" disabled>Confirm</button>
            </div>
          </div>
        </div>

        <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script defer src="vendor/lucide.min.js"></script>
    <script defer src="js/app.js"></script>
  </body>
</html>
