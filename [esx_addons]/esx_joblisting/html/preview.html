<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESX Job Listing — Preview</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .preview-badge {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 9999;
        padding: 6px 14px;
        border: 1px solid rgba(251, 155, 4, 0.35);
        border-radius: 999px;
        background: #161616;
        color: #fb9b04;
        font-family: 'Roboto', sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <span class="preview-badge">PREVIEW</span>

    <main id="app" class="jobcenter hidden" aria-labelledby="jobTitle">
      <section class="job-shell">
        <header class="brand-header">
          <img class="esx-logo" src="assets/esx-logo.png" width="48" height="18" alt="ESX" />
          <div class="brand-heading">
            <h1 id="jobTitle">Job Centre</h1>
            <span id="jobSubtitle">Choose your career</span>
          </div>
          <button id="closeBtn" class="icon-button" type="button" data-icon="X" aria-label="Close" data-tooltip="Close"></button>
        </header>

        <div class="catalog-toolbar">
          <div class="search-field">
            <span data-icon="Search" aria-hidden="true"></span>
            <input id="searchInput" type="search" placeholder="Search jobs..." aria-label="Search jobs" autocomplete="off" spellcheck="false" />
            <button id="searchClear" class="search-clear hidden" type="button" data-icon="X" aria-label="Clear search"></button>
          </div>
        </div>

        <div id="jobList" class="job-list" role="listbox" aria-label="Available jobs"></div>

        <div id="confirmModal" class="confirm-backdrop hidden">
          <div class="confirm-card">
            <div class="confirm-icon" data-icon="Briefcase" aria-hidden="true"></div>
            <h2 id="confirmTitle">Apply for this job?</h2>
            <p id="confirmText"></p>
            <div class="confirm-actions">
              <button id="confirmNo" class="action-button ghost" type="button">Cancel</button>
              <button id="confirmYes" class="action-button primary" type="button" disabled>Confirm</button>
            </div>
          </div>
        </div>

        <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script defer src="vendor/lucide.min.js"></script>

    <script defer>
      const MOCK_THEME = {
        primaryColor: '#FB9B04',
        secondaryColor: '#252525',
        backgroundColor: '#161616',
        accentColor: '#383838'
      };
      const MOCK_JOBS = [
        { name: 'police', label: 'Police Officer', icon: 'Shield', salaryMin: 1200, salaryMax: 2400 },
        { name: 'ambulance', label: 'Paramedic', icon: 'Ambulance', salaryMin: 1100, salaryMax: 2100 },
        { name: 'mechanic', label: 'Mechanic', icon: 'Wrench', salaryMin: 700, salaryMax: 1600 },
        { name: 'taxi', label: 'Taxi Driver', icon: 'Car', description: 'Drive citizens around the city' },
        { name: 'realestate', label: 'Real Estate Agent', icon: 'Home', salaryMin: 600, salaryMax: 1800 },
        { name: 'tailor', label: 'Tailor', icon: 'Scissors', salaryMin: 500, salaryMax: 1200 },
        { name: 'unemployed', label: 'Unemployed', icon: 'User', salaryMin: 200, salaryMax: 200 }
      ];
      const MOCK_CURRENT = MOCK_JOBS[0];

      window.fetch = async (url, init) => {
        const req = String(url);
        let data = {};
        if (req.endsWith('/ready')) {
          data = { theme: MOCK_THEME };
        } else if (req.endsWith('/apply')) {
          let body = {};
          try { body = JSON.parse((init && init.body) || '{}'); } catch {}
          const job = MOCK_JOBS.find((j) => j.name === body.job);
          data = { success: true, reason: null, label: job ? job.label : body.job };
        }
        return new Response(JSON.stringify({ ok: true, data }), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        });
      };
    </script>

    <script defer src="js/app.js"></script>

    <script defer>
      setTimeout(() => {
        window.dispatchEvent(
          new MessageEvent('message', {
            data: {
              action: 'open',
              theme: MOCK_THEME,
              jobs: MOCK_JOBS,
              currentJob: MOCK_CURRENT
            }
          })
        );
      }, 300);
    </script>
  </body>
</html>
